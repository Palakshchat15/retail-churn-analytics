version: 2

sources:
  - name: raw
    # PostgreSQL: schema `raw` (unchanged). BigQuery: dataset `<BQ_DATASET>_raw`
    # (default retail_raw), filled by src/bigquery/load_raw_to_bigquery.py.
    schema: "{{ target.schema ~ '_raw' if target.type == 'bigquery' else 'raw' }}"
    tables:
      - name: retail_transactions
        description: "Raw UCI Online Retail II transaction lines, chunk-loaded from CSV."
        columns:
          - name: invoice
            tests:
              - not_null
          - name: stock_code
            tests:
              - not_null
          - name: invoice_date
            tests:
              - not_null
